<html lang="ru">
<head>
    <title>Тормозные колодки — Прогноз износа</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-cart">
            {{ if .draft }}
            <a href="/brake-pad-wear/{{ .draft.ID }}" class="cart-icon" aria-label="Корзина ({{ len .draft.Items }} шт)" title="Brake pad wear — заявка № {{ .draft.ID }}">🧺<span class="cart-icon__count">{{ len .draft.Items }}</span></a>
            {{ else }}
            <span class="cart-icon cart-icon--disabled" aria-label="Корзина пуста" title="Добавьте услугу — создастся черновик заявки">🧺</span>
            {{ end }}
        </div>
        <div class="header-container">
            <a href="/" class="logo-block">
                <img src="/static/img/logo.png" alt="BrakePad" class="logo-img">
                <span class="logo-text"></span>
            </a>
            <form action="/" method="GET" class="search-form">
                <div class="search-input-wrapper">
                    <input type="text"
                           name="query"
                           class="search-input"
                           placeholder="Поиск по типу колодок..."
                           value="{{ .query }}">
                </div>
                <button type="submit" class="search-btn search-btn--icon" aria-label="Поиск"></button>
            </form>
        </div>
    </header>

<div class="space">

    <!-- Список услуг -->
    <div class="container">
        {{ range .services }}
        <a href="/brake-pad/{{ .ID }}" class="card">
            <img src="{{ $.minioBase }}/test/{{ .ImageURL }}"
                 onerror="this.src='/static/img/placeholder.svg'; this.onerror=null"
                 class="card__image">
            <div class="card__body">
                <h2 class="card__title">{{ .Title }}</h2>
                <div class="card__specs">
                    <p class="card__key-type">Тип: {{ .PadType }}</p>
                    <p class="card__response-time">Базовый ресурс: {{ .BaseResource }} км</p>
                    <p class="card__response-time">Стиль вождения: {{ if .DrivingStyleHint }}{{ .DrivingStyleHint }}{{ else }}—{{ end }}</p>
                </div>
                <div class="card__use-case">
                    {{ .Price }} ₽
                </div>
            </div>
        </a>
        {{ end }}
    </div>

</div>
</body>
</html>
