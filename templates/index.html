<html lang="ru">
<head>
    <title>Тормозные колодки — Прогноз износа</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="/" class="logo-block">
                <img src="/static/img/logo.png" alt="BrakePad" class="logo-img">
                <span class="logo-text"></span>
            </a>
    
            <form action="/" method="GET" class="search-form">
                <div class="search-input-wrapper">
                    <input type="text"
                           name="query"
                           class="search-input"
                           placeholder="Поиск по типу колодок..."
                           value="{{ .query }}">
                </div>
                <button type="submit" class="search-btn search-btn--icon" aria-label="Поиск"></button>
            </form>
        </div>
    </header>

<div class="space">

    <!-- Карточка текущей заявки (черновик/корзина) -->
    {{ if .draft }}
    <a href="/applications/{{ .draft.ID }}" class="calculation-card">
        <div class="calculation-card__title">Корзина (черновик)</div>
        <div class="calculation-card__info">
            <span>Заявка № <strong>{{ .draft.ID }}</strong></span>
            <span>Позиций: <strong>{{ len .draft.Items }}</strong></span>
        </div>
        <form method="POST" action="/cart/delete" style="margin-top: 12px;">
            <button type="submit" class="search-btn" style="height: 40px; padding: 0 14px;">Удалить заявку</button>
        </form>
    </a>
    {{ else }}
    <div class="calculation-card" style="opacity:0.55; cursor:not-allowed;">
        <div class="calculation-card__title">Корзина пуста</div>
        <div class="calculation-card__info">
            <span>Добавь услугу, чтобы создать заявку-черновик</span>
        </div>
    </div>
    {{ end }}

    <!-- Список колодок -->
    <div class="container">
        {{ range .services }}
        <a href="/services/{{ .ID }}" class="card">
            <img src="{{ $.minioBase }}/test/{{ .ImageURL }}"
                 onerror="this.src='/static/img/placeholder.svg'; this.onerror=null"
                 class="card__image">
            <div class="card__body">
                <h2 class="card__title">{{ .Title }}</h2>
                <p class="card__key-type">Тип: {{ .PadType }}</p>
                <p class="card__response-time">Базовый ресурс: {{ .BaseResource }} км</p>
                <div class="card__use-case">
                    {{ .Price }} ₽
                </div>
            </div>
        </a>
        {{ end }}
    </div>

</div>
</body>
</html>
