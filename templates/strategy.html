<html lang="ru">
<head>
    <title>{{ .strategy.Title }} — Подробная информация</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="/" class="logo-block">
                <img src="/static/img/logo.png" alt="BrakePad" class="logo-img">
                <span class="logo-text"></span>
            </a>
    
            <form action="/" method="GET" class="search-form">
                <div class="search-input-wrapper">
                    <input type="text"
                           name="query"
                           class="search-input"
                           placeholder="Поиск по типу колодок..."
                           value="{{ .query }}">
                </div>
                <button type="submit" class="search-btn" aria-label="Поиск"></button>
            </form>
        </div>
    </header>

<div class="detail-wrapper">
    <a href="/" class="back-link">← Вернуться к каталогу</a>

    <div class="detail-card">
        <div class="detail-card__image-col">
            <video class="detail-card__image"
                   src="http://localhost:9000/test/{{ .strategy.Video }}"
                   poster="http://localhost:9000/test/{{ .strategy.Image }}"
                   autoplay
                   muted
                   loop
                   playsinline
                   controls>
                Ваш браузер не поддерживает видео.
            </video>
        </div>

        <div class="detail-card__info-col">
            <div class="detail-card__body">
                <h1 class="detail-card__title">{{ .strategy.Title }}</h1>

                <div class="detail-card__meta-row">
                    <span class="detail-card__badge detail-card__badge--green">
                        {{ .strategy.PadType }}
                    </span>
                    <span class="detail-card__badge detail-card__badge--blue">
                        {{ .strategy.BaseResource }} км
                    </span>
                </div>

                <p class="detail-card__description">
                    {{ .strategy.Description }}
                </p>

                <hr class="detail-card__separator">

                {{ if .hasCalcInfo }}
                <h2 class="detail-card__section-title">Используется в заявке</h2>
                <div class="calc-info-block">
                    <div class="calc-info-block__row">
                        <span><strong>Комментарий:</strong> {{ .calcStrat.Comment }}</span>
                    </div>
                </div>
                {{ end }}
            </div>
        </div>

        <div class="detail-card__aside">
            <div class="detail-card__price-button">
                от {{ .strategy.Price }} ₽
            </div>
            <div class="detail-card__stock">
                В наличии 100 шт
            </div>
        </div>
    </div>
</div>

</body>
</html>
